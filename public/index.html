<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Task Management</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 {
      color: #1e3c72;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #1e3c72;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin: 4px;
    }
    .links {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .links a {
      text-decoration: none;
      background: #2a5298;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .links a:hover { background: #1e3c72; }
    footer {
      margin-top: 30px;
      font-size: 0.75rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Employee Task Management</h1>
    <p>
      A full-stack web application built with <strong>Node.js</strong> and <strong>Express.js</strong>
      for managing employee tasks efficiently.
    </p>
    <div>
      <span class="badge">Node.js HTTP Module</span>
      <span class="badge">FS Module</span>
      <span class="badge">Express.js REST API</span>
    </div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/tasks">View Tasks</a>
      <a href="/about">About</a>
    </div>
    <footer>MT1 Lab Examination &mdash; Full Stack Development</footer>
  </div>
</body>
</html>
